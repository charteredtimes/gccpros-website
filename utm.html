<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>UTM Link + QR Builder · GCCPROs</title>
<style>
  :root{--ink:#0b1526;--panel:#0e1b30;--line:rgba(255,255,255,.12);--teal:#17A2C4;--teal-lite:#57D0E6;--txt:#EAF1FB;--mut:#9DB0C9}
  *{box-sizing:border-box}
  body{margin:0;font-family:'DM Sans',system-ui,Arial,sans-serif;background:linear-gradient(180deg,#080f1c,#0b1526);color:var(--txt);min-height:100vh;padding:28px}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:24px;margin:0 0 4px}
  p.sub{color:var(--mut);margin:0 0 22px;font-size:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}
  label{display:block;font-size:12px;font-weight:700;letter-spacing:.3px;color:#B7C9DF;margin:12px 0 5px}
  input,select{width:100%;font-family:inherit;font-size:14px;color:var(--txt);background:#0b1526;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px}
  input:focus,select:focus{outline:none;border-color:var(--teal-lite)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.row{grid-template-columns:1fr}}
  .presets{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
  .preset{font-size:12.5px;font-weight:600;color:var(--teal-lite);background:rgba(87,208,230,.08);border:1px solid rgba(87,208,230,.35);border-radius:999px;padding:7px 13px;cursor:pointer}
  .out{display:flex;gap:10px;align-items:flex-start;margin-top:6px;flex-wrap:wrap}
  .url{flex:1;min-width:240px;word-break:break-all;background:#0b1526;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;color:#DCE7F7;font-family:'JetBrains Mono',monospace}
  button.act{border:0;cursor:pointer;font-weight:700;font-size:14px;color:#06121f;background:linear-gradient(180deg,var(--teal-lite),var(--teal));padding:12px 18px;border-radius:10px}
  #qr{background:#fff;padding:12px;border-radius:12px;display:inline-block;margin-top:14px}
  .hint{color:var(--mut);font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>UTM Link + QR Builder</h1>
  <p class="sub">Tag every newsletter, WhatsApp, DM and QR link so it stops landing in "Direct". Internal tool — not indexed.</p>

  <div class="card">
    <label for="base">Destination URL</label>
    <input id="base" type="url" value="https://www.gccpros.com/" placeholder="https://www.gccpros.com/insights-events">

    <div class="presets" id="presets"></div>

    <div class="row">
      <div><label for="src">Source (utm_source)</label><input id="src" placeholder="newsletter"></div>
      <div><label for="med">Medium (utm_medium)</label><input id="med" placeholder="email"></div>
    </div>
    <div class="row">
      <div><label for="camp">Campaign (utm_campaign)</label><input id="camp" placeholder="aug_digest"></div>
      <div><label for="cont">Content (utm_content) — optional</label><input id="cont" placeholder="header_cta"></div>
    </div>
    <label for="term">Term (utm_term) — optional</label>
    <input id="term" placeholder="">
  </div>

  <div class="card">
    <label>Your tagged link</label>
    <div class="out">
      <div class="url" id="url">—</div>
      <button class="act" id="copy" type="button">Copy</button>
    </div>
    <div id="qr"></div>
    <div class="hint">Right-click the QR to save it. Keep source/medium lowercase and consistent (e.g. newsletter/email, whatsapp/social, linkedin/social) so GA4 groups them cleanly.</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  var presets=[
    ['Newsletter','newsletter','email','',''],
    ['WhatsApp','whatsapp','social','',''],
    ['WhatsApp Channel','whatsapp_channel','social','',''],
    ['LinkedIn post','linkedin','social','',''],
    ['DM / 1:1','dm','social','',''],
    ['QR (print)','qr','offline','','']
  ];
  var el=function(id){return document.getElementById(id);};
  var pbox=el('presets');
  presets.forEach(function(p){
    var b=document.createElement('button'); b.type='button'; b.className='preset'; b.textContent=p[0];
    b.addEventListener('click',function(){ el('src').value=p[1]; el('med').value=p[2]; if(p[3])el('camp').value=p[3]; build(); });
    pbox.appendChild(b);
  });
  var qr=null;
  function enc(v){ return encodeURIComponent((v||'').trim().toLowerCase().replace(/\s+/g,'_')); }
  function build(){
    var base=(el('base').value||'').trim(); if(!base){ el('url').textContent='—'; return; }
    var parts=[];
    var map={utm_source:el('src').value,utm_medium:el('med').value,utm_campaign:el('camp').value,utm_content:el('cont').value,utm_term:el('term').value};
    for(var k in map){ if(map[k] && map[k].trim()) parts.push(k+'='+enc(map[k])); }
    var url=base + (parts.length ? ((base.indexOf('?')>-1?'&':'?')+parts.join('&')) : '');
    el('url').textContent=url;
    el('qr').innerHTML='';
    if(window.QRCode){ qr=new QRCode(el('qr'),{text:url,width:180,height:180,correctLevel:QRCode.CorrectLevel.M}); }
  }
  ['base','src','med','camp','cont','term'].forEach(function(id){ el(id).addEventListener('input',build); });
  el('copy').addEventListener('click',function(){
    var t=el('url').textContent; if(!t||t==='—')return;
    navigator.clipboard.writeText(t).then(function(){ el('copy').textContent='Copied'; setTimeout(function(){el('copy').textContent='Copy';},1500); });
  });
  build();
})();
</script>
</body>
</html>
