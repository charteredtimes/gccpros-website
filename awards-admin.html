<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Award Nominations — Admin | GCCPROs</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{--ink:#0A1628;--navy:#14213D;--blue:#2E86F0;--line:#E1E6EF;--muted:#5B6B84;--field:#F6F9FE}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',Segoe UI,Arial,sans-serif;color:#12203A;background:#F4F7FC}
  header{background:linear-gradient(180deg,#14213D,#1B3B72);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  header b{font-family:Georgia,serif;font-size:18px}
  header small{display:block;color:#B7C5D8;font-size:12px}
  .wrap{max-width:1240px;margin:0 auto;padding:22px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:0 2px 10px rgba(40,60,110,.05);margin-bottom:16px}
  input,button{font-family:inherit;font-size:14px}
  input[type=password],input[type=text]{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--field);min-width:240px}
  .btn{cursor:pointer;border:none;border-radius:8px;padding:10px 18px;font-weight:700;color:#fff;background:linear-gradient(180deg,#4AA6FF,#2E86F0 55%,#125BD0)}
  .btn.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}
  .btn.gold{background:#1C7C3C}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--muted);font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
  th{background:var(--navy);color:#fff;text-align:left;padding:9px 10px;position:sticky;top:0;white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;max-width:280px;white-space:pre-wrap;word-break:break-word}
  tr:nth-child(even) td{background:#FAFCFF}
  .cat{display:inline-block;font-size:11px;font-weight:700;background:#EEF5FF;color:#125BD0;border:1px solid #CFE2FB;padding:2px 8px;border-radius:20px}
  .scroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}
  .err{color:#B23A2A}
</style>
</head>
<body>
<header>
  <div><b>Award Nominations</b><small>GCCPROs Leadership Excellence Awards 2026 · live admin view</small></div>
  <div id="count" class="muted" style="color:#CADCFC"></div>
</header>

<div class="wrap">
  <div class="card" id="gate">
    <div class="row">
      <input type="password" id="key" placeholder="Admin key (same as admin panel)">
      <button class="btn" onclick="load()">Load nominations</button>
      <span id="gateMsg" class="muted"></span>
    </div>
    <div class="muted" style="margin-top:8px">The admin key is the same one you use on the main admin panel. It is sent only to your Supabase function, never stored.</div>
  </div>

  <div class="card" id="tools" style="display:none">
    <div class="row">
      <button class="btn alt" onclick="load()">&#8635; Refresh</button>
      <button class="btn gold" onclick="exportXlsx()">&#128202; Export to Excel</button>
      <input type="text" id="q" placeholder="Filter (name, org, category, email)…" oninput="render()" style="flex:1;min-width:200px">
    </div>
  </div>

  <div class="card" id="tableCard" style="display:none">
    <div class="scroll"><div id="box"></div></div>
  </div>
</div>

<script>
var NOM_API='https://fufnvnvufmrhrzhcoeil.supabase.co/functions/v1/nominations';
var ROWS=[], KEY='';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function dt(iso){if(!iso)return '';var d=new Date(iso);return isNaN(d)?'':d.toLocaleString();}

async function load(){
  KEY=(document.getElementById('key').value||'').trim();
  if(!KEY){document.getElementById('gateMsg').innerHTML='<span class="err">Enter the admin key.</span>';return;}
  document.getElementById('gateMsg').textContent='Loading…';
  try{
    var r=await fetch(NOM_API+'?action=adminNominations&_t='+Date.now(),{headers:{'X-Admin-Key':KEY}});
    var j=await r.json();
    if(j.error){document.getElementById('gateMsg').innerHTML='<span class="err">'+esc(j.error==='unauthorized'?'Key rejected.':j.error)+'</span>';return;}
    ROWS=j.rows||[];
    document.getElementById('gate').style.display='none';
    document.getElementById('tools').style.display='';
    document.getElementById('tableCard').style.display='';
    render();
  }catch(e){document.getElementById('gateMsg').innerHTML='<span class="err">Network error.</span>';}
}

function filtered(){
  var q=(document.getElementById('q').value||'').trim().toLowerCase();
  if(!q)return ROWS;
  return ROWS.filter(function(x){
    return [x.nominee_name,x.nominee_org,x.category,x.submitter_email,x.submitter_name,x.nominee_designation]
      .some(function(v){return String(v||'').toLowerCase().indexOf(q)>=0;});
  });
}
function render(){
  var rows=filtered();
  document.getElementById('count').textContent=rows.length+' / '+ROWS.length+' nominations';
  if(!ROWS.length){document.getElementById('box').innerHTML='<p class="muted" style="padding:14px">No nominations yet.</p>';return;}
  var h='<table><thead><tr>'
    +'<th>When</th><th>Category</th><th>Nominee</th><th>Designation</th><th>Organisation</th>'
    +'<th>Profile</th><th>Outcome 1</th><th>Outcome 2</th><th>Outcome 3</th><th>Achievements</th>'
    +'<th>Philosophy</th><th>Submitted by</th><th>Email</th><th>Phone</th></tr></thead><tbody>';
  rows.forEach(function(x){
    h+='<tr><td style="white-space:nowrap">'+esc(dt(x.created_at))+'</td>'
      +'<td><span class="cat">'+esc(x.category)+'</span></td>'
      +'<td><b>'+esc(x.nominee_name)+'</b></td>'
      +'<td>'+esc(x.nominee_designation)+'</td>'
      +'<td>'+esc(x.nominee_org)+'</td>'
      +'<td>'+esc(x.professional_profile)+'</td>'
      +'<td>'+esc(x.outcome_1)+'</td><td>'+esc(x.outcome_2)+'</td><td>'+esc(x.outcome_3)+'</td>'
      +'<td>'+esc(x.supporting_achievements)+'</td>'
      +'<td>'+esc(x.leadership_philosophy)+'</td>'
      +'<td>'+esc(x.submitter_name)+'</td>'
      +'<td>'+esc(x.submitter_email)+'</td>'
      +'<td>'+esc(x.submitter_phone)+'</td></tr>';
  });
  document.getElementById('box').innerHTML=h+'</tbody></table>';
}
function exportXlsx(){
  if(!ROWS.length){alert('Nothing to export yet.');return;}
  var cols=[['When','created_at'],['Category','category'],['Nominee','nominee_name'],['Designation','nominee_designation'],
    ['Organisation','nominee_org'],['Professional profile','professional_profile'],['Outcome 1','outcome_1'],
    ['Outcome 2','outcome_2'],['Outcome 3','outcome_3'],['Supporting achievements','supporting_achievements'],
    ['Leadership philosophy','leadership_philosophy'],['Submitted by','submitter_name'],['Email','submitter_email'],
    ['Phone','submitter_phone']];
  var aoa=[cols.map(function(c){return c[0];})];
  ROWS.forEach(function(x){aoa.push(cols.map(function(c){var v=x[c[1]];return c[1]==='created_at'?dt(v):(v==null?'':v);}));});
  var ws=XLSX.utils.aoa_to_sheet(aoa), wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Nominations');
  XLSX.writeFile(wb,'GCCPROs_Award_Nominations_'+new Date().toISOString().slice(0,10)+'.xlsx');
}
</script>
</body>
</html>
